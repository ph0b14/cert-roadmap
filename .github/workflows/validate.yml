name: validate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  dataset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Hard gate: schema violations, duplicate ids, and domain/file mismatches
      # fail the PR. Contributors get the exact record and field that is wrong.
      - run: npm run validate
      - run: npm run build
